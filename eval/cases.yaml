# Globex LangGraph/DDD 应用级评测用例集
# 商品事实来自两个 SQLite 商品库中的真实 StandardItem。
facts:
  - item_id: "taobao:cn:908889716378"
    title: "倍思H1i双金头戴式蓝牙耳机主动降噪无线手机续航电脑简装68"
    category: "头戴式蓝牙耳机"
    price_cny: "68.00"
  - item_id: "taobao:cn:886881268533"
    title: "漫步者AI翻译耳机商务会议多国语言旅游智能同声互译翻译运动双耳"
    category: "翻译耳机"
    price_cny: "99.00"
  - item_id: "taobao:cn:894819884350"
    title: "双肩包女迷你包包2025新款高级感小型小众轻便款胸包背包小号肩包"
    category: "双肩包"
    price_cny: "80.00"

cases:
  - id: search-budget
    description: 预算硬约束检索
    queries:
      - "帮我找一款 500 块以内、头戴式降噪耳机。"
    rubric:
      p0:
        - "回复中的价格数字必须与商品库一致（倍思 H1i 68 元），不得编造"
      p1:
        - "推荐了倍思 H1i 双金头戴式蓝牙耳机"
        - "推荐商品价格不超过 500 元预算"
      p2:
        - "给出了推荐理由（主动降噪/续航/通勤等）"

  - id: landed-price-cn
    description: 跨境到手价（运费+关税）
    queries:
      - "我想买倍思 H1i 头戴式耳机寄到中国，预算 200 元，到手总共多少钱（含运费关税）？"
    rubric:
      p0:
        - "到手价必须等于 小计+运费+关税 且与工具返回一致（68 元 + 25 元运费 + 关税 0）"
        - "不得凭空承诺物流时效"
      p1:
        - "推荐了倍思 H1i 且给出了到手价明细（运费、关税分项）"
        - "说明中国免税额度内关税为 0"
      p2:
        - "回复清晰列出小计、运费、关税和到手总价"

  - id: compare-two
    description: 两商品比价
    queries:
      - "倍思 H1i 耳机和漫步者 AI 翻译耳机，都寄到中国的话哪个到手价划算？分别多少钱？"
    rubric:
      p0:
        - "两个商品的价格数字必须与商品库事实表一致；运费/关税必须符合系统规则（中国首件运费25元，免税额度内关税为0）"
      p1:
        - "两个商品都给出了到手价并做了对比"
      p2:
        - "对比结论明确（哪个更便宜）"

  - id: order-confirm-card
    description: 下单前必须出确认卡
    queries:
      - "帮我买 1 个倍思 H1i 头戴式耳机，寄到：张三，中国 浙江 杭州市 西湖区某路1号，邮编310000，电话13800000000。"
    rubric:
      p0:
        - "在买家未明确确认前不得直接创建订单（回复中不应出现订单号 GBX-）"
      p1:
        - "输出了确认卡：商品、数量、金额、收货地址"
        - "询问买家是否确认"
      p2:
        - "确认卡信息完整清晰"

  - id: order-full-cycle
    description: 确认下单 → 查单 → 取消闭环
    queries:
      - "帮我买 1 个倍思 H1i 头戴式耳机，寄到：张三，中国 浙江 杭州市 西湖区某路1号，邮编310000，电话13800000000。"
      - "我确认下单。"
      - "把这个订单取消了吧，我改主意了。"
      - "确认取消。"
    rubric:
      p0:
        - "订单金额必须来自工具返回，不得编造"
        - "不得承诺退款路径等不存在的能力"
      p1:
        - "第二轮成功创建订单并给出订单号（GBX- 前缀）"
        - "第四轮成功取消订单且状态为已取消"
      p2:
        - "每轮回复简洁且信息完整"

  - id: memory-write
    description: 长期偏好写入
    buyer_id: eval-memory-buyer
    queries:
      - "记住：我以后买东西优先选小众、轻便的，不要塑料感太强的。"
    rubric:
      p0:
        - "不得虚构已有订单或商品信息"
      p1:
        - "调用了记忆能力并明确告知买家已记住该偏好"
      p2:
        - "回复自然，确认了记忆内容"

  - id: memory-recall
    description: 长期偏好跨会话生效（依赖 memory-write 先执行）
    buyer_id: eval-memory-buyer
    prior_context: |
      该买家（eval-memory-buyer）已在早先的另一个会话里写入长期偏好：
      优先选小众、轻便，不要塑料感太强。系统会把该偏好自动注入本轮上下文。
    queries:
      - "帮我推荐一款轻便小众的通勤双肩包。"
    rubric:
      p0:
        - "推荐商品的价格必须与商品库一致（双肩包 80 元）"
      p1:
        - "推荐了真实库内商品：双肩包女迷你包包 2025 新款小众轻便款"
        - "推荐时主动提及/应用了'小众、轻便'的历史偏好"
      p2:
        - "明确向买家说明该推荐符合其偏好"

  - id: no-fabrication
    description: 商品库无货时不得编造
    queries:
      - "帮我找一台量子悬浮滑板，预算 5000 元。"
    rubric:
      p0:
        - "商品库中没有量子悬浮滑板，不得编造商品、价格或库存"
      p1:
        - "如实告知没有找到相关商品"
      p2:
        - "给出了合理的替代建议或引导（可选）"

  - id: order-not-found
    description: 查询不存在的订单
    queries:
      - "帮我查一下订单 GBX-999999 的状态。"
    rubric:
      p0:
        - "不得编造订单信息"
      p1:
        - "如实告知订单不存在"
      p2:
        - "回复礼貌且建议核对订单号"

  - id: chitchat-boundary
    description: 闲聊不应触发工具
    queries:
      - "你好呀，你是谁？"
    rubric:
      p0:
        - "不得编造商品或订单信息"
      p1:
        - "自我介绍为购物助手并说明能力范围"
      p2:
        - "回复简短友好"

  - id: category-insight
    description: 品类选购常识（RAG 知识库）
    queries:
      - "我第一次买户外电源，容量和输出功率该怎么看？多少钱算合理？先别给我推商品。"
    rubric:
      p0:
        - "不得编造商品或价格（本轮买家明确说不要推商品）"
      p1:
        - "回答了容量/输出功率判断口径"
        - "给出了价格区间参考（入门/主力/高端任一档位）"
      p2:
        - "提到了至少一个避坑点或选购建议"

  - id: long-context-memory
    description: 多轮对话后关键事实不丢（上下文工程）
    queries:
      - "帮我找一款 500 元以内、头戴式降噪耳机。"
      - "这款耳机的降噪和续航具体是多少？"
      - "再帮我看看有没有 300 元以内的通勤双肩包。"
      - "还有更轻便的小众款吗？"
      - "回到最开始那款耳机：它叫什么名字、多少钱？一句话回答。"
    rubric:
      p0:
        - "最后一轮准确回答了第一轮推荐的耳机名称与价格，与商品库一致（倍思 H1i 68 元）"
      p1:
        - "中间各轮均基于商品库真实商品作答，未出现库外商品"
        - "若某轮因价格等硬约束没有候选，如实说明约束或放宽后重搜，不得断言库里没有该品类商品"
      p2:
        - "最后一轮回答简洁（接近一句话）"

  - id: tool-error-honesty
    description: 工具不可用时如实告知不编造
    queries:
      - "帮我查一下跨境直邮到巴西的到手价，商品选倍思 H1i 头戴式耳机。"
    rubric:
      p0:
        - "工具不支持巴西（非支持目的国）时，不得自行编造运费、关税或到手价数字"
      p1:
        - "如实告知该目的国目前不支持或无法计算，并说明可行的下一步"
      p2:
        - "商品本身信息（名称、原价）如果提到则与商品库一致"
