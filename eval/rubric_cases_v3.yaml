        - "第三轮才使用唯一的 product_search_tool 工具类型；首次原始 hits 少于 3 时最多再调用一次且只能改 normalized_query。参数使用 platform=reference_seed 且 top_k 在冻结的 1..5 范围内，真实候选充足时最终结构化展示 2 件，并延续前两轮形成的选购口径"
