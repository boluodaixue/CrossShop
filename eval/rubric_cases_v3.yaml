    coverage_points: [summary-freeze-recovery]
    ground_truth_product_ids: [P1008]
    queries:
      - "在默认 128K context、70% soft threshold 下继续同一真实购物会话，直到产生第三次 context.compressed；每次都必须替换为一份有界摘要。"
      - "不要重新搜索：恢复第一次压缩前最早展示的露营灯名称、价格和币种。"
      - "不要重新搜索：恢复两次压缩之间第61轮的商品类别、平台和预算。"
      - "不要重新搜索：恢复第二次压缩前后第91轮的商品类别、平台和预算。"
    rubric:
      p0:
        - "机器证据必须包含至少三次默认阈值下的真实 l3_stage_summary，摘要 hash 各不相同、来源数量单调增加且每次 after_tokens 都小于 before_tokens"
        - "早期 P1008 的名称价格币种以及中期、近期请求事实都必须准确恢复，不得重新搜索或串到其他阶段"
      p1:
