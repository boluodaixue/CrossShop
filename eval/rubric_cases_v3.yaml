        - "三个年龄层恢复探针均发生在第三次压缩后，本地事件中没有 product_search_tool 或 SearchAgent"
      p2:
        - criterion: "多次压缩后的记忆稳定性"
          score_1_anchor: "只能恢复最近事实，早期或中期事实丢失、混淆，或者依靠重新搜索作答"
          score_5_anchor: "无需搜索即可简洁、准确地区分并恢复早期、中期和近期事实"

