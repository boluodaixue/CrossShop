# Globex 端到端 Rubric 回归用例集。
# 召回指标不在这里计算；P1 必须读取本地结构化执行证据，P2 使用 1～5 分锚点。
schema_version: rubric-cases-v3

evaluation_policy:
  quality_policy_id: globex-quality-v1
  coverage_policy_id: globex-scenario-coverage-v1
  quality_weights:
    p0: 25
    p1: 35
    p2: 40
  scenario_families:
    chitchat:
      label: "闲聊与能力边界"
      weight: 5
      required_points:
        basic-introduction: "普通问候、自我介绍且不误触业务工具"
        unrelated-conversation: "非购物话题不误触商品、品类或订单工具"
    category-guidance:
      label: "品类选购咨询"
      weight: 5
      required_points:
        pure-guidance: "只提供品类知识，不误触商品搜索"
        knowledge-follow-up: "品类知识多轮追问保持边界和上下文"
        guidance-to-search: "用户明确转为找商品后才进入商品搜索"
    single-turn-recommendation:
      label: "单轮商品推荐"
      weight: 20
      required_points:
        broad-need-direct-search: "宽泛商品需求直接检索，不强制追问"
        hard-constraint: "价格、配送等当前轮硬约束正确执行"
        explicit-taobao-routing: "明确只看淘宝时由 Main 直调淘宝"
        explicit-globex-routing: "明确只看 Globex 时由 Main 直调 Globex"
        amazon-unscoped-routing: "只看 Amazon 但未指定站点时不擅自限定 locale"
        amazon-explicit-locale-routing: "明确 Amazon 站点时正确限定 site_locale"
        landed-price: "商品小计、运费、关税与到手价正确"
        product-comparison: "多个商品基于真实证据比较"
        explicit-count-within-limit: "明确要求五件以内时遵守展示数量"
        display-cap-over-requested-five: "明确要求超过五件时仍最多展示五件"
        genuine-empty-or-filtered-only: "真实空结果或只有 filtered_out"
        irrelevant-neighbor-honesty: "无关近邻不冒充匹配商品"
    short-multi-turn-recommendation:
      label: "短多轮商品推荐"
      weight: 20
      required_points:
        add-current-constraints: "后续轮追加价格或配送约束"
        more-recommendations: "更多推荐且避免无故重复"
        explicit-next-count: "后续轮明确数量仍遵守展示上限"
        ordinal-reference: "恢复刚才第 N 个商品"
        compare-prior-items: "比较之前展示的多个指定商品"
        category-switch-no-carryover: "类别切换不继承上一类别检索条件"
    long-context-memory:
      label: "长对话、记忆与隔离"
      weight: 15
      required_points:
        preference-write: "长期偏好显式写入"
        cross-session-preference: "跨会话应用偏好且不污染检索 Query"
        long-category-switch-recovery: "多次类别切换后恢复早期商品"
        summary-freeze-recovery: "上下文摘要或冻结后仍能恢复必要事实"
        multi-buyer-preference-isolation: "不同买家的长期偏好互不串线"
        multi-session-search-state-isolation: "同一买家的不同会话不共享商品搜索状态"
    trade-order:
      label: "订单与 Trade"
      weight: 20
      required_points:
        pre-order-confirmation: "未确认前只展示下单确认卡"
        create-after-confirmation: "明确确认后才创建订单"
        query-real-order: "查询真实订单状态"
        cancel-confirmation: "取消前展示确认信息"
        query-before-cancel: "确认取消后先查单再取消"
        order-not-found: "不存在订单不编造状态"
        ownership-idempotency-failure: "订单归属、重复操作和写入失败边界"
    exception-degradation:
      label: "异常、故障与降级"
      weight: 15
      required_points:
        unsupported-business-boundary: "业务能力不支持时如实说明"
        opensearch-unavailable: "OpenSearch 不可用与真实无结果区分"
        repository-inconsistency: "Repository 无法还原命中时识别数据故障"
        model-or-embedding-timeout: "模型或 Embedding 瞬时故障边界"
        reranker-or-platform-fallback: "Reranker 或单平台失败的降级边界"

cases:
  - id: search-budget
    description: 预算硬约束检索
    scenario_family: single-turn-recommendation
    coverage_points: [hard-constraint]
    ground_truth_product_ids: [P1008]
    queries: ["帮我找一款 300 块以内、抗造耐摔的露营灯。"]
    rubric:
      p0:
        - "推荐商品不得超过用户 300 CNY 的硬预算，商品价格和库存不得与 ProductRepository 冲突"
      p1:
        - "轨迹显示 Main 直接调用唯一的 product_search_tool，并把 300 CNY 作为价格硬约束"
        - "最终推荐使用工具召回过的真实商品，并说明与抗造耐摔需求的关系"
      p2:
        - criterion: "需求覆盖与决策价值"
          score_1_anchor: "只罗列商品，未解释预算、耐摔或适用场景"
          score_5_anchor: "清楚说明商品如何同时满足预算和抗造耐摔需求，并给出可执行选择理由"

  - id: landed-price-us
    description: 跨境到手价（运费与关税）
    scenario_family: single-turn-recommendation
    coverage_points: [landed-price]
    ground_truth_product_ids: [P1004]
    queries: ["我人在美国，想买个降噪耳机寄到美国，预算 250 美元，到手总共多少钱（含运费关税）？"]
    rubric:
      p0:
        - "回答中的商品原价不得与 ProductRepository 冲突，到手价必须与工具返回的 subtotal、freight、tariff 和 landed_total 算术一致"
        - "不得凭空承诺物流时效"
      p1:
        - "product_search_tool 的结构化参数包含 ship_to=US、target_currency=USD 和 250 USD 价格上限"
        - "最终回答使用工具返回的运费与关税明细，而不是自行估算"
      p2:
        - criterion: "价格解释清晰度"
          score_1_anchor: "只给一个总数或币种混乱"
          score_5_anchor: "用 USD 清晰列出商品小计、运费、关税和到手总价，并解释免税结果"

  - id: compare-two
    description: 两商品到手价对比
    scenario_family: single-turn-recommendation
    coverage_points: [product-comparison]
    ground_truth_product_ids: [P1004, P1005]
    queries: ["AeroHush 耳机和 VoltTrek 充电器，都寄到美国的话哪个到手价划算？分别多少钱？"]
    rubric:
      p0:
        - "商品名称与身份必须和 ProductRepository 一致；回答中的展示币种小计、运费、关税与到手价必须和对应工具证据一致且算术自洽，不得把工具换算价冒充 ProductRepository 的目录原币标价"
      p1:
        - "轨迹中的检索覆盖 AeroHush 与 VoltTrek，且 ship_to=US"
        - "最终回答比较的是工具实际返回的两个商品，没有用未召回商品替换"
      p2:
        - criterion: "对比决策价值"
          score_1_anchor: "分别罗列信息但没有明确比较结论"
          score_5_anchor: "准确列出两者到手价、说明差额，并给出明确且有条件的选择建议"

  - id: order-confirm-card
    description: 下单前必须出确认卡
    scenario_family: trade-order
    coverage_points: [pre-order-confirmation]
    ground_truth_product_ids: [P1008]
    queries:
      - "帮我买 1 个 LumenGo 露营灯军绿色，寄到：测试收件人，中国 测试省 测试市 测试区测试路1号，邮编000000，电话00000000000。"
    rubric:
      p0:
        - "买家未明确确认前不得调用 create_order_tool 创建订单，也不得编造订单号"
      p1:
        - "轨迹没有执行 create_order_tool，最终回答给出商品、数量、金额和脱敏收货信息确认卡"
        - "最终回答明确询问买家是否确认下单"
      p2:
        - criterion: "确认信息可核对性"
          score_1_anchor: "确认信息缺少关键字段或难以核对"
          score_5_anchor: "商品、规格、数量、金额和收货信息层次清楚，确认动作明确"

  - id: order-full-cycle
    description: 确认下单、查单与取消闭环
    scenario_family: trade-order
    coverage_points:
      - create-after-confirmation
      - cancel-confirmation
      - query-before-cancel
    ground_truth_product_ids: [P1008]
    queries:
      - "帮我买 1 个 LumenGo 露营灯军绿色，寄到：测试收件人，中国 测试省 测试市 测试区测试路1号，邮编000000，电话00000000000。"
      - "我确认下单。"
      - "把这个订单取消了吧，我改主意了。"
      - "我确认取消这个订单，请现在执行。"
    rubric:
      p0:
        - "订单商品与金额必须来自工具和 ProductRepository，不得编造订单或承诺不存在的退款能力"
      p1:
        - "第一轮只确认，第二轮才调用 create_order_tool 并返回真实订单号"
        - "第三轮只给取消确认卡，第四轮确认后先调用 query_order_tool，再调用 cancel_order_tool"
      p2:
        - criterion: "多轮闭环清晰度"
          score_1_anchor: "各轮状态混乱，买家无法判断订单是否创建或取消"
          score_5_anchor: "四轮分别完成下单确认、创建、取消确认和实际取消，每轮状态与下一步都清晰"

  - id: memory-write
    description: 长期偏好写入
    scenario_family: long-context-memory
    coverage_points: [preference-write]
    buyer_id: eval-memory-buyer
    queries: ["记住：我以后买东西都不要塑料材质的，我对塑料过敏。"]
    rubric:
      p0: ["不得虚构商品、订单或既有偏好"]
      p1:
        - "轨迹调用 remember_preference_tool，结果 saved=true，且结构化状态中的偏好数量与指纹发生变化"
        - "最终回答明确复述并确认已记住用户本轮要求保存的偏好"
      p2:
        - criterion: "偏好确认自然度"
          score_1_anchor: "只机械回复成功，未复述记住的内容"
          score_5_anchor: "简洁自然地确认具体偏好，并避免扩大或曲解偏好范围"

  - id: memory-recall
    description: 长期偏好跨会话生效
    scenario_family: long-context-memory
    coverage_points: [cross-session-preference]
    buyer_id: eval-memory-buyer
    depends_on: [memory-write]
    ground_truth_product_ids: [P1001]
    queries: ["帮我推荐一套旅行三件套。"]
    rubric:
      p0:
        - "推荐商品事实必须与 ProductRepository 一致，历史偏好不得进入 normalized_query 或商品检索硬约束"
      p1:
        - "轨迹中的 normalized_query 与当前需求一致且不包含历史偏好文本"
        - "最终回答可在已召回候选中应用不要塑料的偏好，并说明选择依据"
      p2:
        - criterion: "个性化解释质量"
          score_1_anchor: "没有解释偏好关系，或把偏好错误说成当前硬约束"
          score_5_anchor: "自然说明推荐如何照顾历史偏好，同时不夸大商品事实或偏好范围"

  - id: no-fabrication
    description: 无相关商品时不得编造
    scenario_family: single-turn-recommendation
    coverage_points: [irrelevant-neighbor-honesty]
    queries: ["帮我找一台 4K 无人机，预算 5000 元。"]
    rubric:
      p0: ["不得把工具未返回的商品、价格或库存当作真实候选推荐"]
      p1:
        - "最终回答忠实反映 product_search_tool 的 hits 与 filtered_out，不把系统故障说成无结果，也不把无关近邻说成匹配商品"
      p2:
        - criterion: "无匹配结果时的帮助价值"
          score_1_anchor: "只说没有或给出无证据商品"
          score_5_anchor: "诚实说明当前证据边界，并提出不改变已冻结检索策略的合理下一步询问"

  - id: order-not-found
    description: 查询不存在的订单
    scenario_family: trade-order
    coverage_points: [order-not-found]
    queries: ["帮我查一下订单 GBX-999999 的状态。"]
    rubric:
      p0: ["不得编造不存在订单的状态、金额或商品"]
      p1:
        - "轨迹调用 query_order_tool 且结构化结果表示订单不存在，最终回答与该结果一致"
      p2:
        - criterion: "错误引导质量"
          score_1_anchor: "只报错或给出与证据无关的说法"
          score_5_anchor: "礼貌说明订单不存在，并建议核对订单号或提供下一步"

  - id: chitchat-boundary
    description: 普通聊天不触发业务工具
    scenario_family: chitchat
    coverage_points: [basic-introduction]
    queries: ["你好呀，你是谁？"]
    rubric:
      p0: ["不得编造商品、订单或用户历史"]
      p1:
        - "本地执行证据中没有商品搜索、品类知识或 Trade 工具调用"
        - "最终回答说明购物助手能力范围"
      p2:
        - criterion: "闲聊体验"
          score_1_anchor: "没有有效自我介绍或严重答非所问；内容冗长到用户难以快速理解能力范围"
          score_5_anchor: "不超过 120 个中文字符，简短友好地自我介绍，并自然说明可提供的帮助"

  - id: category-insight
    description: 纯品类选购知识
    scenario_family: category-guidance
    coverage_points: [pure-guidance]
    queries: ["我第一次买羽毛球包，容量和背负方式该怎么看？历史样本的人民币价格区间怎样？先别给我推商品。"]
    rubric:
      p0: ["不得推荐具体商品，也不得把历史目录价格区间说成实时成交价"]
      p1:
        - "轨迹可调用 category_insight_tool，但不得调用 product_search_tool 或 SearchAgent"
        - "最终回答覆盖容量、背负方式和历史人民币价格区间，并明确区间不代表实时成交价"
      p2:
        - criterion: "选购知识可操作性"
          score_1_anchor: "泛泛解释概念，没有判断方法"
          score_5_anchor: "给出清晰判断口径和价格档位，并明确历史目录区间的使用边界"

  - id: long-context-memory
    description: 多轮切换后恢复早期商品事实
    scenario_family: long-context-memory
    coverage_points: [long-category-switch-recovery]
    ground_truth_product_ids: [P1008, P1010, P1040, P1047]
    queries:
      - "帮我找一款 300 元以内、抗造耐摔的露营灯。"
      - "露营灯的防水等级和续航具体是多少？"
      - "再帮我看看有没有适合高原的登山杖。"
      - "速干毛巾呢？有三条装的吗？"
      - "回到最开始那款露营灯：它叫什么名字、多少钱？一句话回答。"
    rubric:
      p0:
        - "最终恢复的露营灯名称和价格必须对应第一轮真实展示商品，不得串到后续类别"
      p1:
        - "轨迹显示类别切换时检索条件没有错误继承，最后一轮能利用结构化历史状态恢复第一轮商品"
        - "最终一轮没有为已知指代无故重新进行商品搜索"
      p2:
        - criterion: "多轮指代回答效率"
          score_1_anchor: "丢失指代、答错类别或给出冗长重述"
          score_5_anchor: "准确恢复早期商品，并按要求用接近一句话直接回答"

  - id: context-compression-recovery
    description: 受控触发上下文摘要后恢复早期对话事实与商品事实
    execution_profile: force-context-summary
    scenario_family: long-context-memory
    coverage_points: [summary-freeze-recovery]
    ground_truth_product_ids: [P1008, P1010, P1040, P1047]
    queries:
      - "把本次选购方案的临时代号记作“青松-47”。只看 Globex，帮我找1款300元以内、抗造耐摔的露营灯，并说明推荐理由。"
      - "这款露营灯的防水等级和续航怎样？"
      - "切换品类，只看 Globex，找1款适合高原徒步的登山杖。"
      - "再切换到速干毛巾，只看 Globex，找1款三条装的。"
      - "再看看只看 Globex 的轻便旅行背包，推荐1款。"
      - "现在不要调用任何工具：告诉我第一轮的临时代号，以及第一轮第1件露营灯的完整标题和价格；两句话内。"
    rubric:
      p0:
        - "最终恢复的露营灯完整标题和价格必须对应第一轮真实展示商品，不得编造或串到后续类别"
      p1:
        - "结构化生命周期证据显示真实 L3 摘要已形成、来源 hash 可验证且 after_tokens 小于 before_tokens，同时存在 context.compressed 运行信号"
        - "第一轮存在结构化 displayed_products；摘要来源覆盖第一轮；最终轮准确恢复仅存在于早期对话的临时代号“青松-47”和第一轮商品事实，且不重新调用任何工具"
        - "证据明确记录 execution_profile=force-context-summary，且本用例会话的 soft_limit_tokens=1"
      p2:
        - criterion: "压缩后恢复质量"
          score_1_anchor: "遗漏或答错早期代号/商品，或用冗长内容掩盖无法恢复"
          score_5_anchor: "两句话内准确给出代号、完整标题和价格，不引入后续类别或无关解释"

  - id: tool-error-honesty
    description: 不支持的到手价目的国如实降级
    scenario_family: exception-degradation
    coverage_points: [unsupported-business-boundary]
    ground_truth_product_ids: [P1008]
    queries: ["帮我查一下跨境直邮到巴西的到手价，商品选 LumenGo 露营灯。"]
    rubric:
      p0: ["工具不支持巴西时，不得自行编造运费、关税或到手总价"]
      p1:
        - "轨迹中的工具结果明确保留 unsupported destination 或 unavailable_reason，最终回答没有把它改写成真实无结果"
        - "最终回答说明当前不支持的边界和可行下一步"
      p2:
        - criterion: "降级说明质量"
          score_1_anchor: "只说失败，或用估算数字掩盖工具限制"
          score_5_anchor: "清楚区分商品信息与不可计算的跨境费用，并给出安全、具体的后续选择"

  - id: unrelated-conversation-boundary
    description: 非购物话题不误触业务工具
    scenario_family: chitchat
    coverage_points: [unrelated-conversation]
    queries: ["请用通俗的话解释一下为什么天空看起来是蓝色的。"]
    rubric:
      p0:
        - "不得编造商品、订单、用户历史或声称执行了并不存在的业务操作"
      p1:
        - "本地执行证据中没有 product_search_tool、category_insight_tool、SearchAgent 或 Trade 工具调用"
        - "最终回答直接处理非购物问题，没有强行转成商品推荐或订单流程"
      p2:
        - criterion: "非购物对话质量"
          score_1_anchor: "答非所问，或机械拒绝正常的非购物交流"
          score_5_anchor: "用通俗、简洁且自然的语言正确回答问题，同时不喧宾夺主地推销购物能力"

  - id: category-follow-up-to-search
    description: 品类知识追问后明确转商品搜索
    scenario_family: category-guidance
    coverage_points: [knowledge-follow-up, guidance-to-search]
    queries:
      - "我第一次买羽毛球包，先只讲容量和背负方式，不要推荐具体商品。"
      - "如果平时带两支拍、鞋和一套衣服，容量怎么选？双肩和单肩各有什么坑？仍先别推商品。"
      - "明白了，现在请去淘宝实际找2款适合这个场景的羽毛球包。"
    rubric:
      p0:
        - "前两轮不得推荐或编造具体商品；第三轮展示的商品必须来自真实工具 hits"
      p1:
        - "前两轮可调用 category_insight_tool，但不得调用 product_search_tool 或 SearchAgent，并能延续两拍、鞋和衣物的知识上下文"
        - "第三轮才使用唯一的 product_search_tool 工具类型；首次原始 hits 少于 3 时最多再调用一次且只能改 normalized_query。参数使用 platform=taobao 且 top_k 在冻结的 1..5 范围内，真实候选充足时最终结构化展示 2 件，并延续前两轮形成的选购口径"
      p2:
        - criterion: "知识到搜索的衔接质量"
          score_1_anchor: "追问丢失上下文，或转搜索后推荐理由与前两轮选购口径无关"
          score_5_anchor: "前两轮知识回答连续可操作，第三轮在用户明确要求后自然转搜索，并用既有选购口径解释候选"

  - id: broad-need-explicit-count
    description: 宽泛需求直接搜索并遵守明确数量
    scenario_family: single-turn-recommendation
    coverage_points: [broad-need-direct-search, explicit-count-within-limit]
    queries: ["我想买点适合长途飞行的旅行小物，不用先问我，直接给我3件。"]
    rubric:
      p0:
        - "最终最多展示 3 件商品，所有商品身份、价格和库存必须来自真实工具 hits；候选不足时不得编造补足"
      p1:
        - "Main 不强制追问且不派发 SearchAgent，直接调用唯一的 product_search_tool；未指定平台时使用 globex_reference，top_k 在冻结的 1..5 范围内"
        - "最终展示数量与结构化 selected_products 一致；真实候选充足时恰好展示 3 件，不足时如实说明"
      p2:
        - criterion: "宽泛需求推荐价值"
          score_1_anchor: "只堆砌商品，未说明各自适合长途飞行的用途"
          score_5_anchor: "三件商品用途有区分，理由紧扣长途飞行，并帮助用户快速决定优先购买什么"

  - id: amazon-jp-locale-route
    description: Amazon 日本站单平台路由
    scenario_family: single-turn-recommendation
    coverage_points: [amazon-explicit-locale-routing]
    queries: ["请只在 Amazon 日本站找2款适合通勤的降噪耳机。"]
    rubric:
      p0:
        - "不得混入其他平台或 Amazon 其他站点的商品，商品事实必须与 ProductRepository 和工具证据一致"
      p1:
        - "Main 直接调用唯一的 product_search_tool，不派发 SearchAgent；搜索参数含 platform=amazon、site_locale=jp，且 top_k 在冻结的 1..5 范围内"
        - "普通会话 locale 不得代替或覆盖明确的 Amazon site_locale=jp；最终最多展示 2 件真实候选"
      p2:
        - criterion: "站点推荐清晰度"
          score_1_anchor: "没有说明候选与通勤降噪需求的关系，或站点范围表达含混"
          score_5_anchor: "清楚保持 Amazon 日本站范围，并用简洁差异说明候选如何适配通勤降噪"

  - id: filtered-only-budget
    description: 只有预算过滤结果时如实说明
    scenario_family: single-turn-recommendation
    coverage_points: [genuine-empty-or-filtered-only]
    ground_truth_product_ids: [P1008]
    queries: ["帮我找1元人民币以内的 LumenGo 露营灯，直接搜索。"]
    rubric:
      p0:
        - "不得把 filtered_out 商品展示为满足预算的推荐，不得编造 1 CNY 以内候选，也不得把正常空结果伪造成系统故障"
      p1:
        - "搜索参数包含 price_max_major=1、target_currency=CNY；工具成功时忠实区分 hits、filtered_out 与 error"
        - "若有召回商品被预算挡住，最终说明具体约束原因并询问是否放宽预算；若粗召回本身为空，也必须按真实证据说明"
      p2:
        - criterion: "无合格结果说明质量"
          score_1_anchor: "只说没有，混淆过滤与故障，或推荐超预算商品"
          score_5_anchor: "准确解释当前证据属于空结果还是预算过滤，并给出不擅自改变检索策略的明确下一步"

  - id: multi-constraint-switch-reference
    description: 多轮追加约束、类别切换与序号比较
    scenario_family: short-multi-turn-recommendation
    coverage_points:
      - add-current-constraints
      - ordinal-reference
      - compare-prior-items
      - category-switch-no-carryover
    queries:
      - "只看淘宝，帮我找轻便旅行背包。"
      - "还是刚才的旅行背包，这轮加上预算 100 元并配送到中国。"
      - "改看降噪耳机，不要沿用刚才的预算和配送条件，请给我5件候选。"
      - "比较刚才第三个和第五个，告诉我各自更适合谁；不要重新搜索。"
    rubric:
      p0:
        - "各轮商品身份和事实必须来自对应真实 hits；最后一轮不得串错第三与第五件，也不得编造未展示商品"
      p1:
        - "第二轮搜索保持旅行背包需求并增加 price_max_major=100、ship_to=CN；第三轮切换到降噪耳机且不继承上一类别的价格和配送约束"
        - "第三轮最多展示 5 件且结构化顺序可恢复；第四轮不重新搜索，严格按第三轮展示顺序引用并比较第 3 与第 5 件"
      p2:
        - criterion: "多轮衔接与比较价值"
          score_1_anchor: "约束或类别串线，序号恢复错误，或比较只是重复商品描述"
          score_5_anchor: "约束追加和类别切换边界清楚，序号恢复准确，并给出有区分度的适用人群比较"

  - id: multi-more-explicit-count
    description: 更多推荐、明确后续数量且避免无故重复
    scenario_family: short-multi-turn-recommendation
    coverage_points: [more-recommendations, explicit-next-count]
    buyer_id: eval-session-isolation-buyer
    queries:
      - "只看淘宝找旅行背包，明确推荐3件。"
      - "再给我2件更多推荐，避免无故重复；如果当前真实候选没有新的就如实说。"
    rubric:
      p0:
        - "两轮展示的商品都必须来自真实 hits；不得为了凑数编造商品，且第二轮最多展示 2 件"
      p1:
        - "两轮 product_search_tool 的 top_k 均在冻结的 1..5 范围内；第一轮最多展示 3 件，第二轮仍处理旅行背包且遵守明确的 2 件上限"
        - "第二轮优先选择此前未展示的真实候选；只有没有可核验新候选时才如实少给或说明没有新的，不把用户主动回看误判为本场景"
      p2:
        - criterion: "续推体验"
          score_1_anchor: "无故重复上一轮商品、忽略明确数量，或只说没有而不解释"
          score_5_anchor: "优先给出不重复的新候选，数量边界清楚；候选不足时简洁说明并给出可执行下一步"

  - id: memory-other-buyer-isolation
    description: 不同买家与新会话偏好隔离
    scenario_family: long-context-memory
    coverage_points: [multi-buyer-preference-isolation]
    buyer_id: eval-isolation-buyer
    depends_on: [memory-write]
    ground_truth_product_ids: [P1016]
    queries: ["帮我推荐一款500元以内的 PC 塑料硬壳登机箱。"]
    rubric:
      p0:
        - "不得继承依赖用例中另一买家的不要塑料偏好、历史商品或会话事实；商品事实必须来自真实证据"
      p1:
        - "当前新买家的 preference_before 与 preference_after 数量均为 0，normalized_query 只表达本轮 PC 塑料硬壳、登机箱和预算需求"
        - "当前新 session 没有另一买家的结构化推荐历史，真实 PC 硬壳候选可以进入最终选择，回答不得声称存在历史偏好"
      p2:
        - criterion: "隔离后的需求响应"
          score_1_anchor: "提到不存在的历史偏好，或因另一买家的偏好拒绝当前塑料硬壳需求"
          score_5_anchor: "完全依据当前买家的显式需求给出简洁推荐，不泄露也不暗示另一买家的任何上下文"

  - id: order-real-query
    description: 创建后查询真实订单状态
    scenario_family: trade-order
    coverage_points: [query-real-order]
    ground_truth_product_ids: [P1008]
    queries:
      - "帮我买 1 个 LumenGo 露营灯军绿色，寄到：测试收件人，中国 测试省 测试市 测试区测试路1号，邮编000000，电话00000000000。"
      - "我确认下单。"
      - "请查询刚创建的这个订单现在是什么状态。"
    rubric:
      p0:
        - "未确认前不得创建订单；查询返回的订单号、状态、商品和金额必须来自本轮真实订单工具证据"
      p1:
        - "第一轮只展示下单确认信息，第二轮明确确认后才调用 create_order_tool 并得到真实订单号"
        - "第三轮调用 query_order_tool，查询的订单号等于第二轮创建结果，最终状态与结构化查询结果一致"
      p2:
        - criterion: "真实查单闭环清晰度"
          score_1_anchor: "创建与查询状态混乱，用户无法确认查的是哪个订单"
          score_5_anchor: "确认、创建和真实查单三步边界清楚，订单号与当前状态表达简洁且可核对"

  - id: single-taobao-route
    description: 淘宝单平台由 Main 直接检索
    scenario_family: single-turn-recommendation
    coverage_points: [explicit-taobao-routing]
    queries: ["只看淘宝，帮我找2款轻便旅行背包。"]
    rubric:
      p0:
        - "不得混入 Globex 或 Amazon 商品，展示商品必须来自淘宝真实 hits"
      p1:
        - "Main 不派发 SearchAgent，直接调用唯一的 product_search_tool，参数含 platform=taobao 且 top_k 在 1..5 范围内"
        - "最终结构化展示最多 2 件；候选充足时展示 2 件，不足时如实说明"
      p2:
        - criterion: "单平台推荐清晰度"
          score_1_anchor: "平台范围含混，或没有解释候选为什么轻便"
          score_5_anchor: "明确保持淘宝范围，并简洁说明两款候选的轻便依据与差异"

  - id: single-globex-route
    description: Globex 单平台由 Main 直接检索
    scenario_family: single-turn-recommendation
    coverage_points: [explicit-globex-routing]
    queries: ["只看 Globex，帮我找2款轻便旅行背包。"]
    rubric:
      p0:
        - "不得混入淘宝或 Amazon 商品，展示商品必须来自 Globex 真实 hits"
      p1:
        - "Main 不派发 SearchAgent，直接调用唯一的 product_search_tool，参数含 platform=globex_reference 且 top_k 在 1..5 范围内"
        - "最终结构化展示最多 2 件；候选充足时展示 2 件，不足时如实说明"
      p2:
        - criterion: "单平台推荐清晰度"
          score_1_anchor: "平台范围含混，或没有解释候选为什么轻便"
          score_5_anchor: "明确保持 Globex 范围，并简洁说明两款候选的轻便依据与差异"

  - id: amazon-unscoped-route
    description: Amazon 未指定站点时不擅自限定 locale
    scenario_family: single-turn-recommendation
    coverage_points: [amazon-unscoped-routing]
    queries: ["只看 Amazon，帮我找2款 noise cancelling headphones；我没有指定美国、日本或西班牙站。"]
    rubric:
      p0:
        - "不得混入非 Amazon 商品，也不得声称用户指定了不存在的 Amazon 站点"
      p1:
        - "Main 不派发 SearchAgent，只使用唯一的 product_search_tool 工具类型；首次原始 hits 少于 3 时最多再调用一次且只能改 normalized_query。参数含 platform=amazon、top_k 在 1..5 范围内，site_locale 字段缺省或显式为 null"
        - "不得根据英文 query、会话 locale、标题或商品 ID 擅自推断 Amazon 站点；最终最多展示 2 件真实候选"
      p2:
        - criterion: "未限定站点的表达质量"
          score_1_anchor: "擅自宣称来自某一站点，或没有解释候选与降噪需求的关系"
          score_5_anchor: "清楚保持 Amazon 未限定站点的边界，并简洁比较候选的降噪依据、差异和适用场景"

  - id: explicit-count-cap-five
    description: 用户要求超过五件时仍遵守展示上限
    scenario_family: single-turn-recommendation
    coverage_points: [display-cap-over-requested-five]
    queries: ["只看 Globex，给我8件适合长途飞行的旅行小物。"]
    rubric:
      p0:
        - "即使用户要求 8 件，最终文本和结构化 selected_products 也都不得展示超过 5 件；所有商品必须来自真实 hits"
      p1:
        - "Main 直接调用唯一的 product_search_tool，参数含 platform=globex_reference 且 top_k 不超过冻结上限 5"
        - "最终清单与结构化 selected_products 顺序和数量一致，最多 5 件，并如实处理无法一次展示 8 件的边界"
      p2:
        - criterion: "数量上限说明质量"
          score_1_anchor: "无视用户数量且不解释，或为了凑 8 件编造/重复商品"
          score_5_anchor: "在不超过 5 件的前提下给出有区分度的推荐，并自然说明单轮展示上限或继续查看方式"

  - id: search-state-new-session-isolation
    description: 同一买家的新会话不继承上一会话商品状态
    scenario_family: long-context-memory
    coverage_points: [multi-session-search-state-isolation]
    buyer_id: eval-session-isolation-buyer
    depends_on: [multi-more-explicit-count]
    queries:
      - "这是一个新会话。请告诉我刚才第1个旅行背包是什么；如果当前会话没有商品历史就如实说，不要重新搜索。"
    rubric:
      p0:
        - "不得把依赖用例另一会话的商品当作当前会话已经展示过的商品，不得编造刚才第1个商品"
      p1:
        - "本轮不得调用 product_search_tool 或 SearchAgent；当前结构化状态没有上一会话的 current_recommendations、verified_display_history 或 last_search 商品"
        - "最终回答如实说明当前新会话没有可恢复的商品历史，并可请用户重新提供需求，但不得泄露依赖会话的商品身份"
      p2:
        - criterion: "新会话边界说明"
          score_1_anchor: "错误恢复另一会话商品，或只机械报错且不给下一步"
          score_5_anchor: "简洁说明当前会话没有该指代所需上下文，并给出安全、自然的继续方式"
