# 从已经展示的两款羽毛球包继续，严格禁止重新搜索。该窗口只测 Main 的
# steady-state Prefix Cache，不与搜索子 Agent 的固定提示缓存混算。
warm_cache_queries:
  - "不要重新搜索，也不要增加商品：保留两款羽毛球包的完整准确名称，比较各自的容量取舍。"
  - "仍然不要搜索：如果必须装两支球拍、一双鞋和一套衣服，请保留完整商品名并重新排序这两款。"
  - "只基于已展示信息回答，不要搜索：雨天通勤时这两款分别有什么风险？保留两款完整商品名。"
  - "不要搜索或增加候选：加入一台13寸电脑后，保留完整商品名说明哪款更合适以及为什么。"
  - "最后不要重新搜索：保留两款完整商品名，总结购买结论，不要引入任何新商品。"

recovery_probes:
  - id: recover-first-product
    query: "不要重新搜索：请准确告诉我本次会话最开始展示的第1款露营灯叫什么、当时价格多少、币种是什么。一句话回答。"
    require_anchor_title_price_currency: true
    forbid_product_search: true
  - id: recover-middle-request-after-repeated-compression
    query: "不要重新搜索：请说明本次会话第61轮开始寻找的商品类别、平台和预算，一句话回答。"
    require_anchor_title_price_currency: false
    forbid_product_search: true
    minimum_compressions: 2
    anchor_turn_index: 61
    required_text_fragments: ["睡袋", "示例平台", "600"]
  - id: recover-recent-request-after-repeated-compression
    query: "不要重新搜索：请说明本次会话第91轮开始寻找的商品类别、平台和预算，一句话回答。"
    require_anchor_title_price_currency: false
    forbid_product_search: true
    minimum_compressions: 2
    anchor_turn_index: 91
    required_text_fragments: ["露营折叠椅", "CrossShop", "500"]
