    - "比较本轮第1和第3件的容量、材质和分区，不要重新搜索。"
    - "如果主要装冬季衣物，刚才哪件更合适？不要增加候选。"
    - "指出本轮3件在登机箱内使用时的空间取舍。"
    - "保留准确名称、价格和币种，总结本轮收纳袋。"
  -
    - "重新规划徒步装备，只看 CrossShop 参考目录，找2款500元以内的轻量雨衣。"
    - "比较本轮两款的防护、重量和收纳信息，不要重新搜索。"
