schema_version: context-compression-scenario-v1
scenario_id: natural-shopping-context-compression
locale: zh-CN
currency: CNY

targets:
  cumulative_turns: 10
  max_single_call_total_tokens: 30000
  freeze_stall_check_turns: 3
  warmup_model_calls: 1
  rolling_window_model_calls: 5
  min_rolling_cache_hit_ratio: 0.80
  warm_cache_turns: 5
  min_warm_turn_cache_hit_ratio: 0.75
  max_turns_until_compression: 90
  target_compression_events: 1

# 前十轮固定用于简历中的“10+ 轮单次送模不超过 30K”指标；累计调用量仍单独报告为成本诊断。它们同时建立一个可在压缩后
# 闭卷恢复的露营灯锚点。所有问题都是正常购物行为，不用无意义长文本灌窗口。
anchor_turns:
  - "只看 CrossShop 参考目录，帮我找2款300元以内、抗造耐摔的露营灯，并保留商品原始名称、价格和币种。"
  - "比较刚才两款露营灯的防水等级、续航和重量，不要重新搜索。"
  - "如果主要用于高原露营，刚才两款里哪款更合适？把取舍解释清楚，不要重新搜索。"
  - "切换到登山杖，仍只看 CrossShop 参考目录，找2款适合高原徒步的候选；不要继承露营灯的预算。"
  - "比较刚才两款登山杖的材质、收纳长度和适用人群，不要重新搜索。"
  - "现在找三条装速干毛巾，优先轻量、适合多人露营，给我2款真实候选。"
  - "比较刚才两款毛巾的尺寸、材质和打包体积，不要重新搜索。"
  - "切换到轻便旅行背包，只看示例平台，先给我3件候选。"
  - "还是刚才的旅行背包，这轮增加100元预算并配送到中国。"
  - "比较本轮前两件旅行背包更适合短途还是通勤，不要重新搜索。"

# 后续按真实购物旅程继续增长上下文，runner 在默认 128K/70% 配置首次观察到
# context.compressed 后立即停止增长并进入恢复探针。不得用测试参数降低阈值。
long_journeys:
  -
    - "改看降噪耳机，不沿用背包的预算和配送条件，请在 Amazon 日本站找3件通勤候选。"
    - "比较刚才第1和第3件耳机的降噪、佩戴和续航，不要重新搜索。"
    - "如果每天通勤两小时且戴眼镜，刚才哪件更合适？给出详细理由。"
    - "回顾这一组耳机各自的明显短板，不要增加新商品。"
    - "用表格总结刚才3件耳机，但不要重新搜索。"
  -
    - "切换到羽毛球包，先讲两支拍、鞋和一套衣服需要多大容量，不推荐商品。"
    - "继续说明双肩和单肩在通勤场景的差异，仍不要推荐商品。"
    - "现在只看示例平台，实际找2款符合这个场景的羽毛球包。"
    - "比较刚才两款的分区、防水和背负，不要重新搜索。"
    - "如果还要放一台13寸电脑，刚才哪款更稳妥？不要重新搜索。"
  -
    - "改看PC硬壳登机箱，预算500元，只看示例平台，给我3件真实候选。"
    - "比较刚才第1和第2件的尺寸、轮子和箱体材质，不要重新搜索。"
    - "我更在意耐摔而不是最低价，重新说明这3件的排序理由。"
    - "如果经常坐高铁，刚才哪件更方便？不要重新搜索。"
    - "总结这一组登机箱的适用人群和主要短板。"
  -
    - "回到露营用品，再找2款300元以内的露营灯，这次优先轻量和长续航。"
    - "比较本轮两款与会话最开始那组露营灯的需求差异，不要混淆商品。"
    - "如果是雨天营地使用，本轮两款分别要注意什么？不要重新搜索。"
    - "把本轮两款按便携、续航、防护三个维度详细比较。"
    - "只总结本轮露营灯，不要把登山杖或毛巾混进来。"
  -
    - "重新看登山杖，这次预算400元并优先碳纤维，给我2款候选。"
    - "比较本轮两款的锁紧结构和适用路线，不要重新搜索。"
    - "如果体重较大且走碎石坡，哪款更稳？详细说明依据。"
    - "指出本轮两款各自不适合的人群，不要增加候选。"
    - "总结本轮登山杖并保留准确商品名称和价格。"
  -
    - "再看速干毛巾，这次优先亲肤和小体积，找2款候选。"
    - "比较本轮两款的材质、尺寸和套装数量，不要重新搜索。"
    - "一家三口露营时哪款更实用？说明数量和收纳上的原因。"
    - "列出本轮两款可能的使用限制，不要增加商品。"
    - "用简短清单总结本轮毛巾的选择建议。"
  -
    - "重新看旅行背包，这次只看 Amazon 美国站，不限之前的100元预算，找3件。"
    - "比较本轮第1和第3件的容量、重量和背负，不要重新搜索。"
    - "如果是三天短途旅行，刚才哪件更合适？详细解释。"
    - "如果改成每天通勤，排序会怎么变化？不要重新搜索。"
    - "总结本轮3件背包的适用场景和明显短板。"
  -
    - "最后再看一组降噪耳机，只看示例平台，预算800元，找3件通勤候选。"
    - "比较本轮第2和第3件的降噪、麦克风和舒适度，不要重新搜索。"
    - "办公室长时间佩戴时哪件更合适？详细说明。"
    - "把本轮3件按通勤、会议、长时间佩戴分别排序。"
    - "总结本轮耳机，不要沿用 Amazon 日本站那组商品。"
  -
    - "再找2款羽毛球包，这次只看轻量双肩款，并明确要能放鞋。"
    - "比较本轮两款的鞋仓、拍位和肩带，不要重新搜索。"
    - "雨天通勤时哪款风险更小？详细说明理由。"
    - "指出本轮两款各自的容量取舍，不要增加候选。"
    - "总结本轮羽毛球包并保留准确名称和价格。"
  -
    - "再看PC登机箱，这次配送到中国且预算700元，找2款真实候选。"
    - "比较本轮两款的箱体、轮组和到手价信息，不要重新搜索。"
    - "频繁托运时哪款更稳妥？说明风险，不要编造耐久数据。"
    - "指出本轮两款各自更适合谁，不要增加商品。"
    - "用表格总结本轮登机箱的准确名称、价格与币种。"
  -
    - "继续规划露营装备：只看示例平台，找2款适合零下5度环境的成人睡袋，预算600元。"
    - "比较本轮两款睡袋的温标、填充和收纳体积，不要重新搜索。"
    - "如果主要是自驾露营而不是徒步，本轮两款怎么选？不要增加商品。"
    - "指出本轮两款在潮湿环境中的使用风险，只依据已展示信息。"
    - "保留准确商品名称和价格，总结本轮睡袋的购买建议。"
  -
    - "切换到双人帐篷，只看 CrossShop 参考目录，预算1000元，找2款适合多雨地区的候选。"
    - "比较本轮两款帐篷的防水、重量和搭建方式，不要重新搜索。"
    - "如果两个人第一次露营，哪款更容易上手？不要增加商品。"
    - "分别说明本轮两款在大风天气下需要注意什么，不要编造抗风等级。"
    - "用表格保留本轮两款帐篷的准确名称、价格和币种。"
  -
    - "改看大容量充电宝，只看京东，预算500元，找2款适合露营和高铁出行的候选。"
    - "比较本轮两款的容量、接口和重量，不要重新搜索。"
    - "如果还要给笔记本供电，哪款更合适？只依据已有商品信息。"
    - "说明本轮两款携带上高铁时需要自行核对的限制，不要增加商品。"
    - "保留准确商品名称和价格，总结本轮充电宝的取舍。"
  -
    - "继续看便携炉具，只看示例平台，预算400元，找2款适合两人露营做饭的候选。"
    - "比较本轮两款炉具的重量、收纳和火力信息，不要重新搜索。"
    - "如果在高海拔使用，本轮两款分别有哪些注意事项？不要增加商品。"
    - "指出本轮两款对新手不友好的地方，只依据已展示信息。"
    - "用简短清单保留准确商品名称和价格，总结本轮炉具。"
  -
    - "切换到徒步鞋，只看 Amazon 美国站，预算150美元，找2款适合雨天轻徒步的候选。"
    - "比较本轮两款的鞋面、防滑和重量，不要重新搜索。"
    - "如果脚背偏高，应该优先核对本轮哪款的哪些信息？不要增加商品。"
    - "分别说明本轮两款更适合城市通勤还是山路，只依据已有信息。"
    - "保留准确商品名称、价格和币种，总结本轮徒步鞋。"
  -
    - "最后看轻量冲锋衣，只看京东，预算800元，找2款适合春秋徒步的候选。"
    - "比较本轮两款的防水、透气和重量信息，不要重新搜索。"
    - "如果经常小雨通勤，本轮两款怎么排序？不要增加商品。"
    - "指出本轮两款在冬季使用时需要额外搭配什么，不要编造保暖参数。"
    - "用表格保留准确商品名称和价格，总结本轮冲锋衣。"
  -
    - "继续看露营折叠椅，只看 CrossShop 参考目录，预算500元，找2款适合自驾露营的候选。"
    - "比较本轮两款的重量、承重说明和收纳尺寸，不要重新搜索。"
    - "如果更重视久坐舒适，本轮两款应该怎么选？只依据已有信息。"
    - "指出本轮两款在徒步携带时的主要取舍，不要增加候选。"
    - "保留准确名称、价格和币种，总结本轮折叠椅。"
  -
    - "切换到保温杯，只看示例平台，预算300元，找2款适合通勤的候选。"
    - "比较本轮两款的容量、重量和杯盖结构，不要重新搜索。"
    - "如果每天放在背包里，应该优先核对哪些防漏信息？不要增加商品。"
    - "分别说明本轮两款更适合办公室还是户外，只依据已有信息。"
    - "用简短清单保留准确名称和价格，总结本轮保温杯。"
