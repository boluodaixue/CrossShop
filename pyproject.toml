[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globex-agent-learning"
version = "0.1.0"
description = "Course-driven learning implementation of the Globex ecommerce search agent"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "faiss-cpu>=1.8,<2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-redis>=0.5,<0.6",
    "numpy>=1.26,<3",
    "pyarrow>=17,<24",
    "pydantic>=2.8,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "redis>=5.2.1,<8",
    "sentence-transformers>=3,<6",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["-p", "no:cacheprovider"]
filterwarnings = [
    "ignore:create_react_agent has been moved.*:langgraph.warnings.LangGraphDeprecatedSinceV10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
